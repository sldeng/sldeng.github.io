<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1814;
            color: #f5f0e8;
            padding: 20px;
        }

        .test-section {
            background: rgba(212, 165, 116, 0.1);
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .test-button {
            padding: 15px 30px;
            margin: 10px;
            background: #d4a574;
            border: none;
            border-radius: 5px;
            color: #1a1814;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 99999;
            position: relative;
        }

        .test-button:hover {
            background: #c9a86c;
        }

        .log {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            padding: 5px;
            margin: 2px 0;
        }

        .success { color: #4caf50; }
        .error { color: #f44336; }
        .info { color: #2196f3; }

        #gallery-container {
            margin-top: 30px;
            border: 2px solid #d4a574;
            padding: 20px;
            min-height: 200px;
        }
    </style>
</head>
<body>
    <h1>🧪 点击功能测试</h1>

    <div class="test-section">
        <h2>基础测试</h2>
        <button class="test-button" onclick="testBasicClick()">测试基础点击</button>
        <button class="test-button" onclick="testAddEventListener()">测试addEventListener</button>
        <button class="test-button" onclick="clearLog()">清除日志</button>
    </div>

    <div class="test-section">
        <h2>加载画廊测试</h2>
        <button class="test-button" onclick="loadGalleryCSS()">加载CSS</button>
        <button class="test-button" onclick="loadGalleryJS()">加载JS</button>
        <button class="test-button" onclick="testGallery()">测试画廊</button>
    </div>

    <div id="log" class="log"></div>
    <div id="gallery-container"></div>

    <script>
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        let clickCount = 0;

        function testBasicClick() {
            clickCount++;
            log(`✅ 基础点击成功！第 ${clickCount} 次`, 'success');
            alert('点击功能正常！');
        }

        function testAddEventListener() {
            const btn = document.createElement('button');
            btn.textContent = '动态按钮';
            btn.className = 'test-button';
            btn.style.cssText = 'padding: 15px 30px; margin: 10px; background: #4caf50; color: white; border: none; border-radius: 5px; cursor: pointer;';
            btn.onclick = function() {
                log('✅ 动态按钮点击成功！', 'success');
            };
            document.querySelector('.test-section').appendChild(btn);
            log('已添加动态按钮，请点击它测试', 'info');
        }

        function loadGalleryCSS() {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'travel-gallery.css';
            link.onload = () => log('✅ CSS加载成功', 'success');
            link.onerror = () => log('❌ CSS加载失败', 'error');
            document.head.appendChild(link);
        }

        let galleryLoaded = false;

        function loadGalleryJS() {
            if (galleryLoaded) {
                log('⚠️ JS已经加载过了', 'info');
                return;
            }

            const script = document.createElement('script');
            script.src = 'travel-gallery.js';
            script.onload = () => {
                log('✅ JS加载成功', 'success');
                galleryLoaded = true;
                setTimeout(() => {
                    if (window.travelGallery) {
                        log('✅ travelGallery实例已创建', 'success');
                    } else {
                        log('❌ travelGallery实例未创建', 'error');
                    }
                }, 1000);
            };
            script.onerror = () => log('❌ JS加载失败', 'error');
            document.head.appendChild(script);
        }

        function testGallery() {
            log('开始测试画廊...', 'info');

            // 检查CSS
            const hasCSS = !!document.querySelector('link[href="travel-gallery.css"]');
            log(`CSS已加载: ${hasCSS ? '是' : '否'}`, hasCSS ? 'success' : 'error');

            // 检查JS
            const hasJS = typeof window.TravelGallery !== 'undefined' || typeof window.travelGallery !== 'undefined';
            log(`JS已加载: ${hasJS ? '是' : '否'}`, hasJS ? 'success' : 'error');

            // 检查DOM元素
            const gallery = document.getElementById('travel-gallery');
            if (gallery) {
                log('✅ 画廊容器已创建', 'success');
                const rect = gallery.getBoundingClientRect();
                log(`位置: x=${Math.round(rect.left)}, y=${Math.round(rect.top)}`, 'info');
                log(`大小: w=${Math.round(rect.width)}, h=${Math.round(rect.height)}`, 'info');

                // 检查tab
                const tabs = gallery.querySelectorAll('.travel-tab, .location-tab');
                log(`找到 ${tabs.length} 个tab按钮`, tabs.length > 0 ? 'success' : 'error');

                tabs.forEach((tab, i) => {
                    const styles = window.getComputedStyle(tab);
                    log(`Tab ${i}: "${tab.textContent}"`, 'info');
                    log(`  pointer-events: ${styles.pointerEvents}`, 'info');
                    log(`  cursor: ${styles.cursor}`, 'info');
                    log(`  display: ${styles.display}`, 'info');
                    log(`  z-index: ${styles.zIndex}`, 'info');

                    if (styles.pointerEvents === 'none') {
                        log(`  ❌ 此按钮无法点击！`, 'error');
                    }
                });

            } else {
                log('❌ 画廊容器未创建', 'error');
            }
        }

        // 页面加载后的初始检查
        window.addEventListener('load', () => {
            log('页面加载完成', 'success');
            log('当前URL: ' + window.location.href, 'info');

            if (window.location.protocol === 'file:') {
                log('⚠️ 警告: 使用file://协议，某些功能可能不工作', 'error');
                log('请使用HTTP服务器: python -m http.server 8000', 'info');
            }
        });

        // 监听所有点击事件
        document.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                log(`点击了按钮: "${e.target.textContent}"`, 'info');
            }
        }, true);
    </script>
</body>
</html>
