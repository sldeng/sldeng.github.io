<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #faf8ef;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .score-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .score-box {
            background: #bbada0;
            padding: 10px 20px;
            border-radius: 3px;
            color: white;
            font-size: 18px;
        }

        .grid-container {
            background: #bbada0;
            padding: 15px;
            border-radius: 6px;
            position: relative;
            touch-action: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 15px;
            background: #bbada0;
        }

        .cell {
            width: 60px;
            height: 60px;
            background: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s ease;
        }

        .tile {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #eee4da;
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s ease;
        }

        .tile[data-value="2"] { background: #eee4da; }
        .tile[data-value="4"] { background: #ede0c8; }
        .tile[data-value="8"] { background: #f2b179; color: white; }
        .tile[data-value="16"] { background: #f59563; color: white; }
        .tile[data-value="32"] { background: #f67c5f; color: white; }
        .tile[data-value="64"] { background: #f65e3b; color: white; }
        .tile[data-value="128"] { background: #edcf72; color: white; font-size: 20px; }
        .tile[data-value="256"] { background: #edcc61; color: white; font-size: 20px; }
        .tile[data-value="512"] { background: #edc850; color: white; font-size: 20px; }
        .tile[data-value="1024"] { background: #edc53f; color: white; font-size: 18px; }
        .tile[data-value="2048"] { background: #edc22e; color: white; font-size: 18px; }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(238, 228, 218, 0.73);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 6px;
        }

        .game-over.active {
            display: flex;
        }

        .new-game-btn {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
        }

        @media (max-width: 500px) {
            .cell, .tile {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
            .grid {
                grid-gap: 10px;
            }
            .grid-container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>2048</h1>
    </div>
    <div class="score-container">
        <div class="score-box">
            分数: <span id="score">0</span>
        </div>
        <div class="score-box">
            最高分: <span id="best-score">0</span>
        </div>
    </div>
    <div class="grid-container">
        <div class="grid">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>
        <div class="game-over">
            <h2>游戏结束!</h2>
            <button class="new-game-btn">新游戏</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
