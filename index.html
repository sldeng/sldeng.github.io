<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸识别</title>

    <style>
        /* loading 遮罩 */
        .loading-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* loading 圆圈 */
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #f5f5f5;
            border-top-color: #ED4C37;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<!-- 微信 JS-SDK -->
<script src="//res.wx.qq.com/open/js/jweixin-1.4.0.js"></script>
<!-- uni SDK -->
<script src="//js.cdn.aliyun.dcloud.net.cn/dev/uni-app/uni.webview.0.1.52.js"></script>

<body>

<!-- loading -->
<div id="loading" class="loading-mask">
    <div class="loading-spinner"></div>
</div>

<script>
    function hideLoading() {
        var loading = document.getElementById('loading');
        if (loading) {
            loading.style.display = 'none';
        }
    }

    document.addEventListener('UniAppJSBridgeReady', function () {
        console.log(uni.navigateTo, 'uni.navigateTo');

        uni.navigateTo({
            url: '/pages/IdentityVerifityResult/IdentityVerifityResult',
            success: function (res) {
                console.log('navigate success', res);
            },
            fail: function (err) {
                console.error('navigate fail', err);
            },
            complete: function () {
                hideLoading();
            }
        });

        uni.postMessage({
            data: {
                action: 'postMessage'
            }
        });
    });
</script>

</body>
</html>
