<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人脸识别</title>

    <style>
        /* loading 容器（透明 + 禁止点击） */
        .loading-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent; /* 透明但可拦截事件 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: all; /* 关键：禁止点击 */
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(237, 76, 55, 0.2);
            border-top-color: #ED4C37;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        .loading-text {
            margin-top: 14px;
            font-size: 14px;
            color: #ED4C37;
            letter-spacing: 1px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<!-- 微信 JS-SDK -->
<script src="//res.wx.qq.com/open/js/jweixin-1.4.0.js"></script>
<!-- uni SDK -->
<script src="//js.cdn.aliyun.dcloud.net.cn/dev/uni-app/uni.webview.0.1.52.js"></script>

<body>

<!-- loading -->
<div id="loading" class="loading-mask">
    <div class="loading-spinner"></div>
    <div class="loading-text">身份核验中…</div>
</div>

<script>
    function hideLoading() {
        var loading = document.getElementById('loading');
        if (loading) {
            loading.style.display = 'none';
        }
    }

    document.addEventListener('UniAppJSBridgeReady', function () {
        uni.navigateTo({
            url: '/pages/IdentityVerifityResult/IdentityVerifityResult',
            complete: function () {
                hideLoading();
            }
        });

        uni.postMessage({
            data: {
                action: 'postMessage'
            }
        });
    });
</script>

</body>
</html>
