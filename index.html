<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>支付宝强制下载 URL 图片</title>
</head>
<body>

<button id="downloadBtn" style="padding:10px 20px;font-size:16px;">
  下载图片
</button>

<script>
var imageUrl = "https://bc6.afbza.cn/mqrcode/qrcodeImg/1797313/1765522747945.png"; // 替换成你的

document.getElementById("downloadBtn").onclick = function () {

  // 方案：fetch → Blob → 强制下载
  fetch(imageUrl)
    .then(response => response.blob())
    .then(blob => {
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "image.png";     // 下载文件名（可自定义）
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      URL.revokeObjectURL(url);
    })
    .catch(err => {
      console.error("下载失败:", err);
      alert("下载图片失败，请检查 URL 是否可访问");
    });
};
</script>

</body>
</html>
