<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行 · 拾光 | Travel Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d4a574;
            --secondary: #8b7355;
            --accent: #c9a86c;
            --dark: #1a1814;
            --light: #f5f0e8;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--dark);
            min-height: 100vh;
            color: var(--light);
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 80%, rgba(139, 115, 85, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(201, 168, 108, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(212, 165, 116, 0.05) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none !important;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none !important;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0;
            animation: float-up 15s infinite;
        }

        @keyframes float-up {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-100px) scale(1); }
        }

        /* Film Grain Overlay */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            z-index: 1000;
            pointer-events: none !important;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%' height='100%' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* 闪瞎狗眼效果 */
        .blind-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none !important;
            overflow: hidden;
        }

        .flash-star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            animation: flash 0.8s ease-in-out infinite;
        }

        @keyframes flash {
            0%, 100% { opacity: 0.2; transform: scale(1); box-shadow: 0 0 0 transparent; }
            50% { opacity: 1; transform: scale(2); box-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff00de, 0 0 40px #ff00de; }
        }

        /* 全屏闪光效果 */
        .screen-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 9999;
            pointer-events: none;
            animation: flash-screen 0.15s ease-out;
        }

        @keyframes flash-screen {
            0% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        /* 多点闪光爆发 */
        .flash-burst {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #fff 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            animation: burst-flash 0.5s ease-out infinite;
        }

        @keyframes burst-flash {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50% {
                transform: scale(5);
                opacity: 0.8;
            }
            100% {
                transform: scale(10);
                opacity: 0;
            }
        }

        /* 扫描光束 */
        .scan-flash {
            position: absolute;
            width: 3px;
            height: 100vh;
            background: linear-gradient(to bottom, transparent, #fff, transparent);
            animation: scan-move 2s linear infinite;
            filter: blur(2px);
        }

        @keyframes scan-move {
            0% { left: -10px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        /* 闪电效果 */
        .lightning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 9998;
            pointer-events: none;
            opacity: 0;
        }

        .lightning.flash {
            animation: lightning-flash 0.2s ease-out;
        }

        @keyframes lightning-flash {
            0%, 100% { opacity: 0; }
            10%, 30%, 50% { opacity: 0.9; }
            20%, 40% { opacity: 0.3; }
        }

        .rainbow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none !important;
            background: linear-gradient(
                45deg,
                #ff0000, #ff7300, #fffb00, #48ff00,
                #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000
            );
            background-size: 400% 400%;
            animation: rainbow-flow 3s ease infinite;
            opacity: 0.15;
        }

        @keyframes rainbow-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow-particle {
            position: absolute;
            border-radius: 50%;
            animation: glow-float 4s ease-in-out infinite;
        }

        @keyframes glow-float {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
                filter: hue-rotate(0deg);
            }
            50% {
                transform: translateY(-30px) scale(1.5);
                opacity: 1;
                filter: hue-rotate(180deg);
            }
        }

        .laser-beam {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffff, #ff00ff, #00ffff, transparent);
            animation: laser-sweep 2s linear infinite;
            opacity: 0.8;
            filter: blur(1px);
        }

        @keyframes laser-sweep {
            0% { transform: translateX(-100%) rotate(0deg); }
            100% { transform: translateX(100vw) rotate(360deg); }
        }

        /* Header */
        .header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 100px 20px 60px;
            animation: fade-in-up 1.5s ease-out;
        }

        .header-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .header h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 300;
            letter-spacing: 20px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 0%, #ff00de 25%, #00ffff 50%, #fffb00 75%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: title-shine 2s linear infinite, neon-pulse 0.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 10px #ff00de) drop-shadow(0 0 20px #00ffff) drop-shadow(0 0 30px #ff00de);
        }

        @keyframes title-shine {
            to { background-position: 200% center; }
        }

        @keyframes neon-pulse {
            from {
                filter: drop-shadow(0 0 5px #ff00de) drop-shadow(0 0 10px #00ffff);
            }
            to {
                filter: drop-shadow(0 0 20px #ff00de) drop-shadow(0 0 40px #00ffff) drop-shadow(0 0 60px #ff00de);
            }
        }

        .header-quote {
            font-size: 1rem;
            color: rgba(245, 240, 232, 0.6);
            letter-spacing: 4px;
            font-style: italic;
            position: relative;
            display: inline-block;
        }

        .header-quote::before,
        .header-quote::after {
            content: '✦';
            margin: 0 15px;
            color: var(--primary);
            opacity: 0.5;
        }

        /* Navigation */
        .album-nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 80px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .album-btn {
            position: relative;
            padding: 18px 50px;
            border: 1px solid rgba(212, 165, 116, 0.3);
            background: rgba(26, 24, 20, 0.6);
            backdrop-filter: blur(10px);
            color: var(--light);
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            letter-spacing: 6px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            pointer-events: auto !important;
        }

        .album-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 222, 0.5), rgba(0, 255, 255, 0.5), transparent);
            transition: left 0.6s ease;
        }

        .album-btn:hover::before {
            left: 100%;
        }

        .album-btn::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff00de, #00ffff, #fffb00, #ff00de);
            background-size: 400% 400%;
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            animation: border-flow 3s ease infinite;
            transition: opacity 0.3s ease;
        }

        @keyframes border-flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .album-btn:hover,
        .album-btn.active {
            border-color: transparent;
            background: rgba(26, 24, 20, 0.8);
            transform: translateY(-3px);
            box-shadow:
                0 10px 40px rgba(255, 0, 222, 0.3),
                0 0 60px rgba(0, 255, 255, 0.2),
                0 0 100px rgba(255, 251, 0, 0.1);
        }

        .album-btn:hover::after,
        .album-btn.active::after {
            opacity: 1;
        }

        .album-btn .btn-icon {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .album-btn .btn-text {
            display: block;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Album */
        .album {
            display: none;
        }

        .album.active {
            display: block;
            animation: album-fade-in 0.8s ease-out;
        }

        @keyframes album-fade-in {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .album-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 15px;
            margin-bottom: 80px;
            color: var(--light);
            position: relative;
            padding-bottom: 30px;
        }

        .album-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        /* Section */
        .section {
            margin-bottom: 100px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 400;
            letter-spacing: 8px;
            color: var(--primary);
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        .section-title::before,
        .section-title::after {
            content: '—';
            margin: 0 20px;
            opacity: 0.3;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        /* Photo Card - Polaroid Style */
        .photo-card {
            position: relative;
            background: var(--light);
            padding: 15px 15px 50px 15px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(var(--rotation, 0deg));
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(212, 165, 116, 0.1);
            animation: card-reveal 0.8s ease-out backwards;
            pointer-events: auto !important;
        }

        .photo-card:nth-child(odd) {
            --rotation: -1deg;
        }

        .photo-card:nth-child(even) {
            --rotation: 1deg;
        }

        .photo-card:nth-child(3n) {
            --rotation: -0.5deg;
        }

        @keyframes card-reveal {
            from {
                opacity: 0;
                transform: translateY(50px) rotate(var(--rotation, 0deg));
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(var(--rotation, 0deg));
            }
        }

        .photo-card:hover {
            transform: translateY(-15px) rotate(0deg) scale(1.03);
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.4),
                0 0 0 2px rgba(255, 0, 222, 0.5),
                0 0 20px rgba(255, 0, 222, 0.3),
                0 0 40px rgba(0, 255, 255, 0.2),
                0 0 80px rgba(255, 251, 0, 0.1);
            z-index: 10;
            animation: card-glow 0.5s ease-in-out infinite alternate;
        }

        @keyframes card-glow {
            from {
                box-shadow:
                    0 25px 60px rgba(0, 0, 0, 0.4),
                    0 0 0 2px rgba(255, 0, 222, 0.5),
                    0 0 20px rgba(255, 0, 222, 0.3),
                    0 0 40px rgba(0, 255, 255, 0.2);
            }
            to {
                box-shadow:
                    0 25px 60px rgba(0, 0, 0, 0.4),
                    0 0 0 2px rgba(0, 255, 255, 0.5),
                    0 0 20px rgba(0, 255, 255, 0.3),
                    0 0 40px rgba(255, 251, 0, 0.2),
                    0 0 60px rgba(255, 0, 222, 0.1);
            }
        }

        .photo-card-inner {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #e8e4dc 0%, #d4cfc4 100%);
        }

        .photo-card-inner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.1) 0%, transparent 50%);
            z-index: 1;
            pointer-events: none;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            filter: saturate(0.9) contrast(1.05);
            position: relative;
            z-index: 2;
        }

        .photo-card:hover img {
            transform: scale(1.1);
            filter: saturate(1.1) contrast(1.1);
        }

        /* Photo overlay effect */
        .photo-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                135deg,
                rgba(212, 165, 116, 0.1) 0%,
                transparent 50%,
                rgba(201, 168, 108, 0.05) 100%
            );
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .photo-card:hover::after {
            opacity: 1;
        }

        /* Caption area */
        .photo-card-caption {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 2px;
            opacity: 0.7;
            z-index: 3;
        }

        /* Loading State */
        .photo-card img.loading {
            opacity: 0.3;
            filter: blur(10px);
        }

        /* Error Placeholder */
        .error-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8e4dc 0%, #d4cfc4 100%);
            color: #8b7355;
            font-size: 12px;
            letter-spacing: 2px;
            z-index: 4;
        }

        .error-placeholder span {
            font-size: 30px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 8, 6, 0.97);
            backdrop-filter: blur(20px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            animation: lightbox-zoom 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes lightbox-zoom {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 2px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 100px rgba(212, 165, 116, 0.1);
        }

        .lightbox-close {
            position: absolute;
            top: 40px;
            right: 50px;
            width: 50px;
            height: 50px;
            border: 1px solid rgba(245, 240, 232, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(26, 24, 20, 0.5);
            backdrop-filter: blur(10px);
        }

        .lightbox-close:hover {
            transform: rotate(90deg) scale(1.1);
            border-color: var(--primary);
            background: rgba(212, 165, 116, 0.2);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border: 1px solid rgba(245, 240, 232, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light);
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(26, 24, 20, 0.5);
            backdrop-filter: blur(10px);
        }

        .lightbox-nav:hover {
            border-color: var(--primary);
            background: rgba(212, 165, 116, 0.2);
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-prev { left: 50px; }
        .lightbox-next { right: 50px; }

        .lightbox-counter {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: rgba(245, 240, 232, 0.5);
        }

        /* Footer */
        .footer {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 80px 20px 60px;
        }

        .footer-text {
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            letter-spacing: 6px;
            color: rgba(245, 240, 232, 0.4);
            text-transform: uppercase;
        }

        .footer-divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 30px auto;
        }

        /* Animations */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 60px 20px 40px; }
            .header h1 { letter-spacing: 10px; }
            .album-nav { gap: 20px; }
            .album-btn { padding: 15px 30px; }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 20px;
            }
            .photo-card { padding: 10px 10px 35px 10px; }
            .lightbox-close, .lightbox-nav {
                width: 45px;
                height: 45px;
                font-size: 20px;
            }
            .lightbox-close { top: 20px; right: 20px; }
            .lightbox-prev { left: 20px; }
            .lightbox-next { right: 20px; }
        }
    </style>
    <link rel="stylesheet" href="click-fix.css">
    <link rel="stylesheet" href="travel-gallery.css">
</head>
<body>
    <div class="rainbow-bg"></div>
    <div class="bg-gradient"></div>
    <div class="particles" id="particles"></div>
    <div class="grain-overlay"></div>
    <div class="blind-overlay" id="blind-overlay"></div>
    <div class="lightning" id="lightning"></div>


    



    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <div class="lightbox-close">&times;</div>
            <div class="lightbox-nav lightbox-prev">❮</div>
            <img src="" alt="预览图" id="lightbox-img">
            <div class="lightbox-nav lightbox-next">❯</div>
            <div class="lightbox-counter" id="lightbox-counter"></div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // 闪瞎狗眼效果
        function createBlindEffect() {
            const container = document.getElementById('blind-overlay');

            // 创建闪烁星星
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'flash-star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                star.style.animationDuration = (0.05 + Math.random() * 0.1) + 's';
                container.appendChild(star);
            }

            // 创建发光粒子
            const colors = ['#ff006e', '#8338ec', '#3a86ff', '#06ffa5', '#ffbe0b', '#ff5400'];
            for (let i = 0; i < 30; i++) {
                const glow = document.createElement('div');
                glow.className = 'glow-particle';
                glow.style.left = Math.random() * 100 + '%';
                glow.style.top = Math.random() * 100 + '%';
                const size = 5 + Math.random() * 20;
                glow.style.width = size + 'px';
                glow.style.height = size + 'px';
                glow.style.background = colors[Math.floor(Math.random() * colors.length)];
                glow.style.animationDelay = Math.random() * 4 + 's';
                glow.style.animationDuration = (3 + Math.random() * 3) + 's';
                glow.style.boxShadow = `0 0 ${size}px ${size/2}px ${glow.style.background}`;
                container.appendChild(glow);
            }

            // 创建激光束
            for (let i = 0; i < 5; i++) {
                const laser = document.createElement('div');
                laser.className = 'laser-beam';
                laser.style.top = (20 + i * 15) + '%';
                laser.style.width = (100 + Math.random() * 200) + 'px';
                laser.style.animationDelay = Math.random() * 2 + 's';
                laser.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
                container.appendChild(laser);
            }

            // 创建闪光爆发点
            for (let i = 0; i < 15; i++) {
                const burst = document.createElement('div');
                burst.className = 'flash-burst';
                burst.style.left = Math.random() * 100 + '%';
                burst.style.top = Math.random() * 100 + '%';
                burst.style.animationDelay = Math.random() * 2 + 's';
                burst.style.animationDuration = (0.3 + Math.random() * 0.5) + 's';
                container.appendChild(burst);
            }

            // 创建扫描光束
            for (let i = 0; i < 3; i++) {
                const scan = document.createElement('div');
                scan.className = 'scan-flash';
                scan.style.animationDelay = (i * 0.7) + 's';
                scan.style.animationDuration = (1.5 + Math.random()) + 's';
                container.appendChild(scan);
            }
        }
        createBlindEffect();

        // 随机闪电效果
        function triggerLightning() {
            const lightning = document.getElementById('lightning');
            lightning.classList.add('flash');
            setTimeout(() => {
                lightning.classList.remove('flash');
            }, 200);

            // 随机下次闪电时间 (2-6秒)
            setTimeout(triggerLightning, 2000 + Math.random() * 4000);
        }
        // 启动闪电效果
        setTimeout(triggerLightning, 1000);

        // 定时全屏闪光
        function screenFlash() {
            const flash = document.createElement('div');
            flash.className = 'screen-flash';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 150);
        }
        // 每2秒闪光一次
        setInterval(screenFlash, 8000); // 降低频率到8秒一次

        // 额外的高频闪光
        function quickFlash() {
            const flash = document.createElement('div');
            flash.className = 'screen-flash';
            flash.style.animationDuration = '0.08s';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 80);
        }
        // setInterval(quickFlash, 1000); // 已禁用高频闪光

        // Album switching
        const albumBtns = document.querySelectorAll('.album-btn');
        const albums = document.querySelectorAll('.album');

        albumBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                albumBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const albumId = btn.dataset.album;
                albums.forEach(album => {
                    album.classList.remove('active');
                    if (album.id === albumId) {
                        album.classList.add('active');
                        // Re-trigger animations
                        album.querySelectorAll('.photo-card').forEach(card => {
                            card.style.animation = 'none';
                            card.offsetHeight;
                            card.style.animation = null;
                        });
                    }
                });
            });
        });

        // Lightbox functionality
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCounter = document.getElementById('lightbox-counter');
        const photoCards = document.querySelectorAll('.photo-card');
        let currentIndex = 0;
        let currentAlbumImages = [];

        photoCards.forEach((card) => {
            card.addEventListener('click', () => {
                // 获取当前活动相册的所有图片
                currentAlbumImages = Array.from(document.querySelectorAll('.album.active .photo-card img'));

                // 检查是否找到图片
                if (currentAlbumImages.length === 0) {
                    console.warn('当前相册没有图片');
                    return;
                }

                // 找到被点击图片的索引
                const clickedImg = card.querySelector('img');
                currentIndex = currentAlbumImages.findIndex(img => img.src === clickedImg.src);

                // 如果找不到，使用第一张图片
                if (currentIndex === -1) {
                    console.warn('未找到被点击的图片，使用第一张');
                    currentIndex = 0;
                }

                updateLightboxImage();
                lightbox.classList.add('active');
            });
        });

        function updateLightboxImage() {
            // 安全检查：确保有图片且索引有效
            if (!currentAlbumImages || currentAlbumImages.length === 0) {
                console.warn('没有可显示的图片');
                return;
            }

            // 确保索引在有效范围内
            if (currentIndex < 0 || currentIndex >= currentAlbumImages.length) {
                currentIndex = 0;
            }

            const img = currentAlbumImages[currentIndex];
            if (img && img.src) {
                lightboxImg.src = img.src;
                lightboxCounter.textContent = `${currentIndex + 1} / ${currentAlbumImages.length}`;
            } else {
                console.warn('图片对象无效:', img);
            }
        }

        document.querySelector('.lightbox-close').addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) lightbox.classList.remove('active');
        });

        document.querySelector('.lightbox-next').addEventListener('click', (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % currentAlbumImages.length;
            updateLightboxImage();
        });

        document.querySelector('.lightbox-prev').addEventListener('click', (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + currentAlbumImages.length) % currentAlbumImages.length;
            updateLightboxImage();
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') lightbox.classList.remove('active');
            if (e.key === 'ArrowRight') {
                currentIndex = (currentIndex + 1) % currentAlbumImages.length;
                updateLightboxImage();
            }
            if (e.key === 'ArrowLeft') {
                currentIndex = (currentIndex - 1 + currentAlbumImages.length) % currentAlbumImages.length;
                updateLightboxImage();
            }
        });

        // Image loading
        document.querySelectorAll('.photo-card img').forEach(img => {
            const handleLoad = () => {
                img.classList.remove('loading');
            };

            const handleError = function() {
                this.classList.remove('loading');
                this.style.display = 'none';
                const placeholder = document.createElement('div');
                placeholder.className = 'error-placeholder';
                placeholder.innerHTML = '<span>✦</span><div>暂无影像</div>';
                this.parentNode.appendChild(placeholder);
            };

            // Check if already loaded (from cache)
            if (img.complete) {
                handleLoad();
            } else {
                img.classList.add('loading');
                img.addEventListener('load', handleLoad);
                img.addEventListener('error', handleError);
            }
        });

        // Parallax effect on scroll
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const bgGradient = document.querySelector('.bg-gradient');
            bgGradient.style.transform = `translateY(${scrolled * 0.3}px)`;
        });
    </script>

        // 延迟检查

        // 暴露到全局
        window.checkGallery = checkGalleryStatus;
    })();
    </script>
