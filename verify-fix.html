<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复验证</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1814;
            color: #f5f0e8;
            padding: 20px;
            margin: 0;
        }

        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            font-weight: bold;
        }

        .status.success {
            background: #4caf50;
            color: white;
        }

        .status.error {
            background: #f44336;
            color: white;
        }

        .status.info {
            background: #2196f3;
            color: white;
        }

        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            background: #d4a574;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #1a1814;
            font-weight: bold;
        }

        button:hover {
            background: #c9a86c;
        }

        #log {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>✅ 修复验证页面</h1>

        <div class="status success">
            ✅ 如果你能看到这个页面并点击下面的按钮，说明基础功能正常
        </div>

        <div class="status info">
            ℹ️ 请尝试点击下面的所有按钮
        </div>

        <h2>点击测试</h2>
        <button onclick="test1()">测试按钮 1</button>
        <button onclick="test2()">测试按钮 2</button>
        <button onclick="test3()">测试按钮 3</button>
        <button id="btn4">测试按钮 4 (addEventListener)</button>

        <h2>状态</h2>
        <div id="status"></div>

        <h2>日志</h2>
        <div id="log"></div>

        <h2>下一步</h2>
        <button onclick="window.location.href='index.html'">前往 index.html</button>
        <button onclick="window.location.href='click-emergency.html'">前往 紧急诊断</button>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        let clickCount = 0;

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML = `<div>[${time}] ${msg}</div>` + logDiv.innerHTML;
        }

        function test1() {
            clickCount++;
            log(`✅ 按钮1点击成功！总点击: ${clickCount}`);
            updateStatus();
        }

        function test2() {
            clickCount++;
            log(`✅ 按钮2点击成功！总点击: ${clickCount}`);
            updateStatus();
        }

        function test3() {
            clickCount++;
            log(`✅ 按钮3点击成功！总点击: ${clickCount}`);
            updateStatus();
        }

        document.getElementById('btn4').addEventListener('click', function() {
            clickCount++;
            log(`✅ 按钮4点击成功！(addEventListener) 总点击: ${clickCount}`);
            updateStatus();
        });

        function updateStatus() {
            if (clickCount >= 4) {
                statusDiv.innerHTML = '<div class="status success">🎉 所有按钮都能正常点击！现在前往 index.html 测试</div>';
            } else {
                statusDiv.innerHTML = `<div class="status info">已点击 ${clickCount}/4 个按钮</div>`;
            }
        }

        // 初始化
        log('页面加载完成');
        log(`URL: ${window.location.href}`);

        if (window.location.protocol === 'file:') {
            log('⚠️ 警告: 使用file://协议');
            statusDiv.innerHTML = '<div class="status error">❌ 请使用HTTP服务器，不要用file://协议</div>';
        } else {
            statusDiv.innerHTML = '<div class="status success">✅ 使用HTTP协议</div>';
        }

        // 全局点击监听
        document.addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON') {
                log(`🖱️ 点击了: ${e.target.textContent}`);
            }
        }, true);
    </script>
</body>
</html>
